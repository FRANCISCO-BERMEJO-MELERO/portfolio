<script>
function fit(){document.querySelectorAll('figure.b').forEach(function(f){
  var w=parseFloat(getComputedStyle(f).getPropertyValue('--w'));
  var avail=Math.min(window.innerWidth-48,1360-48);
  f.style.setProperty('--s',Math.min(1,avail/w));
});}
document.querySelectorAll('figure.b iframe').forEach(function(i){
  i.addEventListener('load',function(){try{var h=i.contentDocument.documentElement.scrollHeight;
    var f=i.closest('figure.b'); if(h>0) f.style.setProperty('--h',h+'px');}catch(e){}});
});
fit(); window.addEventListener('resize',fit);
</script>
